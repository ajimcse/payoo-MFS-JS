<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Home</title>
</head>

<body>
    <main class="flex justify-center">
        <div class="mockup-phone bg-white">
            <div class="mockup-phone-camera"></div>
            <div class="mockup-phone-display grid place-content-center ">
                <!-- balance -->
                <div class="text-center">
                    <div class="stats shadow  ">
                        <div class="stat">

                            <div id="available-balance" class="stat-value">8400</div>
                            <div class="stat-desc">Available Banance</div>
                        </div>
                    </div>
                </div>
                <div class="divider"></div>
                <!-- user Button -->
                <div>
                    <button id="" class="btn btn-lg">Add Money</button>
                    <button id=" " class="btn btn-lg">Cash Out</button>
                </div>
                <!-- add money start  -->
                <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl hidden">
                    <div class="card-body">
                        <fieldset class="fieldset">
                            <label class="label">Amount</label>
                            <input id="add-amount-input" type="text" class="input" placeholder="Amount" />
                            <label class="label">Password</label>
                            <input id="add-password-input" type="password" class="input" placeholder="Password" />
                            
                            <button id="add-money-btn" class="btn btn-neutral mt-4">Add Money</button>
                        </fieldset>
                    </div>
                </div>
                <!-- add Money End -->
                 <!-- cash Out start -->
                <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl">
                    <div class="card-body">
                        <fieldset class="fieldset">
                            <label class="label">Amount</label>
                            <input id="cash-out-input" type="text" class="input" placeholder="Amount" />
                            <label class="label">Password</label>
                            <input id="cash-password-input" type="password" class="input" placeholder="Password" />
                            
                            <button id="cash-out-btn" class="btn btn-neutral mt-4">Cash Out</button>
                        </fieldset>
                    </div>
                </div>
                <!-- cahs out end -->
            </div>
        </div>
    </main>
    <script src="./js/home.js"></script>
    <script src="./js/cashOut.js"></script>
</body>

</html>
