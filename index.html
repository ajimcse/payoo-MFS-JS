<!DOCTYPE html>
<html lang="en" theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title></title>
</head>

<body>
    <main class="flex justify-center">
        <div class="mockup-phone   ">
        <div class="camera"></div>
        <div class="display ">
            <div class="artboard artboard-demo phone-1">
                <div class="hero bg-base-200 min-h-screen rounded-xl">
                    <div class="hero-content flex-col lg:flex-row-reverse">
                        
                        <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl">
                            <div class="card-body">
                                <fieldset class="fieldset">
                                    <label class="label">Mobile Number</label>
                                    <input id="your-number" type="number" class="input"   placeholder="Enter your number" />
                                    <label class="label">Password</label>
                                    <input id="your-password" type="password" class="input" required placeholder="Password" />
                                    <div><a class="link link-hover">Forgot password?</a></div>
                                    <button id="btn-login" class="btn btn-neutral mt-4">Login</button>
                                </fieldset>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </main>
    <script src="./js/login.js"></script>
</body>

</html>
